<aside class="sidebar" [class.collapsed]="collapsed()" [class.mobile-open]="mobileOpen()">

  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="brand-icon">
      <img
        ngSrc="/assets/branding/clinic-abp-logo.svg"
        width="24"
        height="24"
        alt="Logo de Clinica ABP"
      />
    </div>
    <div class="brand-text">
      <span class="brand-name">Clínica ABP</span>
      <span class="brand-sub">Sistema de Gestión</span>
    </div>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav">
    @for (section of sections; track section.label) {
      <div class="nav-section-label">{{ section.label }}</div>

      @for (item of section.items; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [pTooltip]="collapsed() ? item.label : ''"
          tooltipPosition="right"
          (click)="closeMobile()"
        >
          <span class="nav-icon"><i [class]="item.icon"></i></span>
          <span class="nav-label">{{ item.label }}</span>

          @if (item.badge) {
            <span class="nav-badge">{{ item.badge }}</span>
          }
        </a>
      }
    }
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar">DR</div>
      <div class="user-info">
        <span class="user-name">Dr. Ramírez</span>
        <span class="user-role">Administrador</span>
      </div>
    </div>
  </div>

</aside>
