<div class="app-shell">
  <!-- Mobile overlay -->
  @if (mobileSidebarOpen()) {
    <div class="overlay" (click)="closeMobileSidebar()"></div>
  }

  <!-- Sidebar -->
  <app-sidebar
    [collapsed]="sidebarCollapsed()"
    [mobileOpen]="mobileSidebarOpen()"
    (mobileClose)="closeMobileSidebar()"
  />

  <!-- Main area -->
  <div class="main-area">
    <app-topbar (menuToggle)="toggleSidebar()" />

    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>
