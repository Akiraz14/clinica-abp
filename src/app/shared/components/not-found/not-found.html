<div class="nf-shell">
  <div class="nf-card">

    <!-- Ilustración -->
    <div class="nf-illustration">
      <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" class="nf-svg">
        <!-- Monitor -->
        <rect x="30" y="20" width="140" height="95" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5"/>
        <rect x="38" y="28" width="124" height="72" rx="4" fill="#f0f9ff"/>
        <!-- Cruz médica rota -->
        <rect x="88" y="44" width="24" height="8" rx="2" fill="#94a3b8"/>
        <rect x="96" y="36" width="8" height="24" rx="2" fill="#94a3b8"/>
        <!-- 404 en pantalla -->
        <text x="100" y="82" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="700" fill="#cbd5e1">404</text>
        <!-- Soporte monitor -->
        <rect x="92" y="115" width="16" height="14" rx="2" fill="#bae6fd"/>
        <rect x="76" y="128" width="48" height="6" rx="3" fill="#bae6fd"/>
        <!-- Pulso ECG (línea plana = error) -->
        <polyline points="38,64 58,64 64,50 68,78 74,64 78,64 82,56 84,64 126,64 162,64"
          fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
        <!-- Puntos decorativos -->
        <circle cx="20"  cy="30"  r="3" fill="#bae6fd" opacity="0.6"/>
        <circle cx="178" cy="110" r="4" fill="#bae6fd" opacity="0.4"/>
        <circle cx="15"  cy="100" r="2" fill="#94a3b8" opacity="0.4"/>
        <circle cx="185" cy="40"  r="3" fill="#94a3b8" opacity="0.3"/>
      </svg>
    </div>

    <!-- Texto -->
    <div class="nf-code">404</div>
    <h1 class="nf-title">Página no encontrada</h1>
    <p class="nf-desc">
      La ruta <code class="nf-route">{{ rutaActual }}</code> no existe o fue movida.<br>
      Serás redirigido al inicio en <span class="nf-counter">{{ contador() }}s</span>
    </p>

    <!-- Acciones -->
    <div class="nf-actions">
      <p-button
        label="Volver atrás"
        icon="pi pi-arrow-left"
        severity="secondary"
        [outlined]="true"
        (onClick)="goBack()"
      />
      <p-button
        label="Ir al dashboard"
        icon="pi pi-home"
        (onClick)="goToDashboard()"
      />
    </div>

    <!-- Links rápidos -->
    <div class="nf-links">
      <span class="nf-links-label">Ir directamente a:</span>
      <div class="nf-links-grid">
        <button class="nf-link" (click)="goToPatients()">
          <i class="pi pi-users"></i>Pacientes
        </button>
        <button class="nf-link" (click)="goToAppointments()">
          <i class="pi pi-calendar"></i>Citas
        </button>
        <button class="nf-link" (click)="goToReports()">
          <i class="pi pi-chart-bar"></i>Reportes
        </button>
        <button class="nf-link" (click)="goToConfiguration()">
          <i class="pi pi-cog"></i>Configuración
        </button>
      </div>
    </div>

  </div>
</div>
